name: Glass TV KT Preview APK
on:
  workflow_dispatch:
  push:
    branches: [codex/kt-trg01-preview]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile isolated preview
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :preview:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: glass-tv-kuala-terengganu-preview-apk
          path: launcher/preview/build/outputs/apk/release/preview-release.apk
