name: Build Waktu Solat TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "solat-tv/**"
      - ".github/workflows/waktu-solat.yml"
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: solat-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Download licensed azan audio
        run: bash tools/download-audio.sh
      - name: Verify live JAKIM timetable
        run: python3 tools/check-jakim.py
      - name: Test and build
        run: gradle --no-daemon testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Waktu-Solat-TV-APK
          path: solat-tv/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
